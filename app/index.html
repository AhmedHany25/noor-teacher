<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A6B54" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1A17" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="إدارة الطلاب والحلقات والحضور والمستحقات لمعلم القرآن" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>نور القرآن — أداة المعلم</title>
    <script>
      // Apply the saved theme before the first paint (same key as src/lib/theme.ts).
      try {
        var t = localStorage.getItem('noor-theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t)
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = t === 'dark' ? '#0D1A17' : '#0A6B54'
          })
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
