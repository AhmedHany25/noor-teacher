# Sends lesson reminders (app/scripts/notify.ts) every 5 minutes.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT (Firebase service account JSON).
# GitHub runs scheduled workflows only from the default branch, and may delay them a few minutes.
name: Lesson reminders

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: lesson-reminders
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsx scripts/notify.ts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
